<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiteCut</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <h1>LiteCut</h1>

    <!-- 1. Import media -->
    <section>
      <h2>1. Import Media</h2>
      <input type="file" id="file-input" accept="video/*,audio/*" multiple>
      <div id="media-list"></div>
      <div id="media-empty" class="empty-state">
        <div class="empty-state-text">Import video or audio files to get started</div>
      </div>
    </section>

    <!-- 2. Preview with NATIVE controls -->
    <section>
      <h2>2. Preview</h2>
      <div id="preview-container">
        <video id="preview" controls></video>
        <div id="preview-empty" class="empty-state preview-empty">
          <div class="empty-state-text">Import media to preview</div>
        </div>
      </div>
      <div id="time-display">0:00 / 0:00</div>
    </section>

    <!-- 3. Timeline -->
    <section>
      <h2>3. Timeline (drag media here)</h2>
      <div class="toolbar">
        <button id="btn-split" disabled>Split<span class="shortcut">S</span></button>
        <button id="btn-delete" disabled>Delete<span class="shortcut">Del</span></button>
      </div>
      <div id="timeline">
        <div id="ruler"></div>
        <div class="track" id="video-track" data-type="video">
          <span class="track-label">Video</span>
          <span class="track-hint" id="video-hint">← Drag video clips here</span>
        </div>
        <div class="track" id="audio-track" data-type="audio">
          <span class="track-label">Audio</span>
          <span class="track-hint" id="audio-hint">← Drag audio clips here</span>
        </div>
        <div id="playhead" style="left: 10px;"></div>
      </div>
    </section>

    <!-- 4. Project -->
    <section>
      <h2>4. Project</h2>
      <div class="project-header">
        <span id="project-name" class="project-name">Untitled Project</span>
        <button id="btn-rename" class="btn-small">Rename</button>
      </div>
      <div class="project-actions">
        <button id="btn-new">+ New</button>
        <button id="btn-save">Save</button>
        <div class="dropdown">
          <button id="btn-load">Open</button>
          <div id="project-list" class="dropdown-content"></div>
        </div>
        <button id="btn-export" onclick="alert('Export coming soon!')">Export</button>
      </div>
      <div id="save-status" style="margin-top: 10px; font-size: 12px; color: #888;"></div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
