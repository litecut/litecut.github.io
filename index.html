<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiteCut</title>
<meta name="description" content="A light browser video editor for timelines that are both OpenTimelineIO and JSON-LD: lanes, prompts and directions, open from any URL.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar">
  <div class="brand"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9l6 3-6 3z" fill="currentColor"/></svg> LiteCut <span class="ver" id="ver"></span></div>
  <div class="title" id="title">No project</div>
  <nav class="actions">
    <button id="b-library" title="Library">Library</button>
    <button id="b-open" title="Open a timeline URL">Open URL</button>
    <label class="btn" title="Open a .otio / .jsonld / .json file">File<input type="file" id="f-open" accept=".otio,.json,.jsonld,application/json" hidden></label>
    <button id="b-undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="b-save" title="Save in this browser (Ctrl+S)">Save</button>
    <button id="b-download" title="Download the timeline">Download</button>
    <button id="b-put" title="Save back to its URL (a Solid pod)">Save to pod</button>
  </nav>
</header>
<main class="stage">
  <aside class="library" id="library" hidden>
    <div class="lib-head"><input id="lib-filter" placeholder="Filter" aria-label="Filter the library"><span id="lib-count"></span></div>
    <ul id="lib-list"></ul>
  </aside>
  <section class="viewer">
    <video id="video" playsinline preload="metadata"></video>
    <div class="transport"><button id="b-play" aria-label="Play">Play</button><span id="time">0:00.0 / 0:00.0</span><span id="status" role="status"></span></div>
  </section>
  <aside class="inspector" id="inspector"><p class="hint">Select a clip to see its prompt, direction and credits.</p></aside>
</main>
<section class="timeline" id="timeline" tabindex="0" aria-label="Timeline">
  <div class="tl-tools"><label>Zoom <input type="range" id="zoom" min="0.2" max="12" step="0.1" value="1"></label>
    <span class="keys">Space play · S split · Del delete · drag to move · drag edges to trim · Ctrl+Z undo</span></div>
  <div class="tl-body" id="tl-body">
    <div class="heads" id="heads"></div>
    <div class="scroller" id="scroller"><div class="canvas" id="canvas"><div class="ruler" id="ruler"></div><div class="lanes" id="lanes"></div><div class="playhead" id="playhead"></div></div></div>
  </div>
</section>
<script type="module" src="js/app.js"></script>
</body>
</html>
